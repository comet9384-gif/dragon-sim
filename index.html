<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Симулятор дракона</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: #15121f; color: #f1ead8; min-height: 100vh; }
.layout { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 1.5rem; }
h2 { margin: 0 0 12px; font-size: 1.1rem; }
.sub { margin: 4px 0 0; color: #bfb49a; font-size: .95rem; }
.card { background: #201a2e; border: 1px solid #3a3050; border-radius: 12px; padding: 14px; }
.stage { display: grid; justify-items: center; gap: 8px; }
.stage svg { width: 100%; max-width: 300px; height: auto; }
.caption { margin: 0; text-align: center; color: #bfb49a; font-size: .95rem; min-height: 1.4em; }
fieldset { border: 0; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
legend { font-size: .9rem; color: #bfb49a; margin-bottom: 6px; padding: 0; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.options label { display: inline-flex; align-items: center; gap: 6px; background: #15121f; border: 1px solid #4a3f66; border-radius: 8px; padding: 8px 10px; min-height: 44px; cursor: pointer; }
.options input { width: 18px; height: 18px; margin: 0; accent-color: #f7d774; }
.options label:has(input:focus-visible) { outline: 3px solid #f7d774; outline-offset: 2px; }
.bars { display: grid; gap: 12px; }
.bar-head { display: flex; justify-content: space-between; font-size: .9rem; color: #bfb49a; margin-bottom: 4px; }
.track { height: 12px; background: #15121f; border-radius: 999px; overflow: hidden; border: 1px solid #3a3050; }
.track i { display: block; height: 100%; background: #f7d774; width: 0; transition: width .4s ease; }
.inv { margin: 12px 0 0; color: #bfb49a; font-size: .95rem; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.field { display: grid; gap: 6px; font-size: .95rem; margin-bottom: 12px; }
select, input, button { font: inherit; min-height: 44px; border-radius: 8px; border: 1px solid #4a3f66; background: #15121f; color: #f1ead8; padding: 8px 10px; }
button { background: #7a2e4a; border-color: #9b4a68; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button.ghost { background: transparent; border-color: #4a3f66; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #f7d774; outline-offset: 2px; }
.msg { margin: 10px 0 0; min-height: 1.4em; }
.error { color: #ff8a8a; }
.muted { color: #8d8475; }
.note-form { display: grid; gap: 10px; margin-bottom: 12px; }
.log { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; max-height: 360px; overflow-y: auto; }
.log li { background: #15121f; border: 1px solid #3a3050; border-radius: 10px; padding: 10px; }
.log time { display: block; color: #8d8475; font-size: .8rem; margin-bottom: 2px; }
@media (min-width: 480px) { .note-form { grid-template-columns: 1fr auto; align-items: end; } }
@media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>
</head>
<body>
<main class="layout">
  <header>
    <h1>Симулятор дракона</h1>
    <p class="sub">Настрой облик, охоться, летай и веди журнал логова. Всё сохраняется в этом браузере.</p>
  </header>

  <section class="card stage">
    <svg id="dragon" viewBox="0 0 300 220" role="img" aria-label="Дракон"></svg>
    <p id="caption" class="caption"></p>
  </section>

  <section class="card">
    <h2>Облик</h2>
    <div id="customs"></div>
  </section>

  <section class="card">
    <h2>Состояние</h2>
    <div id="bars" class="bars" aria-live="polite"></div>
    <p id="inv" class="inv"></p>
  </section>

  <section class="card">
    <h2>Действия</h2>
    <label class="field">Биом
      <select id="biome"></select>
    </label>
    <div class="actions">
      <button type="button" data-act="hunt">Охотиться</button>
      <button type="button" data-act="fly">Полететь</button>
      <button type="button" data-act="eat">Поесть</button>
      <button type="button" data-act="rest">Отдохнуть</button>
    </div>
    <p id="msg" class="msg" role="status"></p>
  </section>

  <section class="card">
    <h2>Журнал логова</h2>
    <form id="noteForm" class="note-form">
      <label class="field">Заметка
        <input id="noteText" type="text" maxlength="200" placeholder="Что произошло">
      </label>
      <button type="submit">Записать</button>
    </form>
    <ul id="log" class="log"></ul>
    <p id="empty" class="muted" hidden>Записей пока нет.</p>
    <button id="clearLog" type="button" class="ghost">Очистить журнал</button>
  </section>
</main>

<script>
(() => {
  const KEY = 'dragon-sim-v1';
  const BIOMES = [
    { id: 'mountains', label: 'Горные пики' },
    { id: 'forest', label: 'Лес' },
    { id: 'desert', label: 'Пустыня' },
    { id: 'swamp', label: 'Болото' },
    { id: 'tundra', label: 'Тундра' },
    { id: 'caves', label: 'Пещеры' }
  ];
  const COLORS = [
    { id: 'emerald', label: 'Изумрудный', main: '#2e8b57', dark: '#1b5e3b' },
    { id: 'ruby', label: 'Рубиновый', main: '#b22234', dark: '#6e1220' },
    { id: 'sapphire', label: 'Сапфировый', main: '#2456a6', dark: '#15336b' },
    { id: 'gold', label: 'Золотой', main: '#d4a017', dark: '#8a6410' },
    { id: 'obsidian', label: 'Обсидиановый', main: '#4a5061', dark: '#22252e' }
  ];
  const SCALES = [
    { id: 'fine', label: 'Мелкая' },
    { id: 'plate', label: 'Пластинчатая' },
    { id: 'spike', label: 'Шипы' }
  ];
  const WINGS = [
    { id: 'bat', label: 'Перепончатые' },
    { id: 'feather', label: 'Перьевые' },
    { id: 'stub', label: 'Короткие' }
  ];
  const SADDLES = [
    { id: 'none', label: 'Без седла' },
    { id: 'leather', label: 'Кожаное', main: '#8b5a2b', dark: '#5a3a1a' },
    { id: 'war', label: 'Боевое', main: '#5c6370', dark: '#2f333b' }
  ];
  const ACCESSORIES = [
    { id: 'crown', label: 'Корона' },
    { id: 'collar', label: 'Ошейник' },
    { id: 'amulet', label: 'Амулет' },
    { id: 'helmet', label: 'Шлем' },
    { id: 'blanket', label: 'Попона' }
  ];
  const LOOT = {
    meat: { label: 'жареная баранина', group: 'Мясо' },
    nugget: { label: 'блестящий самородок', group: 'Самородки' },
    ore: { label: 'руда', group: 'Руды' }
  };
  const WING_SHAPES = {
    bat: `<path d='M125 120 C95 30 35 20 12 62 C42 60 56 76 63 96 C42 94 26 106 20 126 C52 118 88 128 125 142 Z'/>`,
    feather: `<path d='M125 118 C100 70 70 50 28 52 C58 66 70 80 74 98 C56 92 40 100 34 116 C62 110 84 120 125 142 Z'/><ellipse cx='30' cy='44' rx='12' ry='5' transform='rotate(-20 30 44)'/><ellipse cx='48' cy='36' rx='12' ry='5' transform='rotate(-10 48 36)'/>`,
    stub: `<path d='M125 120 C112 92 88 82 66 86 C78 98 84 108 84 122 C98 126 112 132 125 142 Z'/>`
  };
  const DECAY = { hunger: 1.2, energy: 0.8 };
  const clamp = v => Math.max(0, Math.min(100, v));

  const $ = id => document.getElementById(id);
  const els = {
    svg: $('dragon'), caption: $('caption'), customs: $('customs'), bars: $('bars'),
    inv: $('inv'), biome: $('biome'), msg: $('msg'), log: $('log'), empty: $('empty'),
    noteForm: $('noteForm'), noteText: $('noteText'), clearLog: $('clearLog')
  };

  function fresh() {
    return {
      color: 'emerald', scale: 'fine', wing: 'bat', saddle: 'none', accessories: [],
      hunger: 70, energy: 80, tick: Date.now(),
      inv: { meat: 0, nugget: 0, ore: 0 }, best: 0, log: []
    };
  }

  function load() {
    const base = fresh();
    try {
      const p = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (p && typeof p === 'object') {
        return {
          ...base, ...p,
          inv: { ...base.inv, ...(p.inv || {}) },
          accessories: Array.isArray(p.accessories) ? p.accessories : [],
          log: Array.isArray(p.log) ? p.log : []
        };
      }
    } catch (err) {}
    return base;
  }

  let state = load();
  let saveError = false;

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      saveError = false;
    } catch (err) {
      saveError = true;
    }
  }

  function applyDecay() {
    const now = Date.now();
    const minutes = Math.max(0, (now - state.tick) / 60000);
    state.hunger = clamp(state.hunger - DECAY.hunger * minutes);
    state.energy = clamp(state.energy - DECAY.energy * minutes);
    state.tick = now;
  }

  function biomeLabel(id) {
    const b = BIOMES.find(x => x.id === id);
    return b ? b.label : id;
  }

  function addLog(text) {
    state.log.unshift({ t: Date.now(), text });
    if (state.log.length > 200) state.log.length = 200;
  }

  function buildSvg() {
    const c = COLORS.find(x => x.id === state.color) || COLORS[0];
    const scale = state.scale;
    const saddle = SADDLES.find(x => x.id === state.saddle) || SADDLES[0];
    const wingEl = `<g fill='${c.dark}' stroke='${c.dark}' stroke-width='2' stroke-linejoin='round'>${WING_SHAPES[state.wing] || WING_SHAPES.bat}</g>`;
    const spikes = scale === 'spike' ? buildSpikes(c.dark) : '';
    const blanket = state.accessories.includes('blanket')
      ? `<path d='M92 116 Q150 98 208 114 L204 152 Q150 168 96 152 Z' fill='#7a2e4a' stroke='#3e1624' stroke-width='2' stroke-linejoin='round'/><path d='M96 152 Q150 168 204 152' fill='none' stroke='#d4a017' stroke-width='3' stroke-dasharray='6 4'/>`
      : '';
    const saddleEl = buildSaddle(saddle);
    return `
      <defs>
        <pattern id='pat-fine' width='12' height='12' patternUnits='userSpaceOnUse'><circle cx='6' cy='6' r='4.5' fill='none' stroke='#000' stroke-opacity='.35' stroke-width='1.2'/></pattern>
        <pattern id='pat-plate' width='22' height='16' patternUnits='userSpaceOnUse'><rect x='1' y='1' width='20' height='14' rx='5' fill='none' stroke='#000' stroke-opacity='.35' stroke-width='1.5'/></pattern>
        <pattern id='pat-spike' width='20' height='20' patternUnits='userSpaceOnUse'><path d='M10 2 L14 10 L6 10 Z' fill='#000' fill-opacity='.3'/></pattern>
      </defs>
      ${wingEl}
      <g transform='translate(300 0) scale(-1 1)'>${wingEl}</g>
      <path d='M85 150 C40 170 30 200 15 190 C35 185 45 160 80 140 Z' fill='${c.main}' stroke='${c.dark}' stroke-width='2'/>
      ${spikes}
      <ellipse cx='150' cy='135' rx='72' ry='46' fill='${c.main}' stroke='${c.dark}' stroke-width='2'/>
      <ellipse cx='150' cy='135' rx='72' ry='46' fill='url(#pat-${scale})'/>
      <ellipse cx='150' cy='152' rx='48' ry='22' fill='#f3e3b5' opacity='.85'/>
      <rect x='115' y='165' width='16' height='34' rx='7' fill='${c.dark}'/>
      <rect x='167' y='165' width='16' height='34' rx='7' fill='${c.dark}'/>
      <path d='M185 110 C198 92 204 82 210 70 L242 72 C234 100 224 122 214 146 Z' fill='${c.main}' stroke='${c.dark}' stroke-width='2'/>
      <path d='M218 44 L222 18 L234 42 Z' fill='${c.dark}'/>
      <ellipse cx='232' cy='62' rx='30' ry='22' fill='${c.main}' stroke='${c.dark}' stroke-width='2'/>
      <ellipse cx='232' cy='62' rx='30' ry='22' fill='url(#pat-${scale})'/>
      <path d='M254 56 L284 66 L254 72 Z' fill='${c.dark}'/>
      <circle cx='240' cy='56' r='6' fill='#fff'/>
      <circle cx='242' cy='56' r='3' fill='#111'/>
      ${blanket}
      ${saddleEl}
      ${buildAccessories(state.accessories)}`;
  }

  function buildSpikes(dark) {
    let out = '';
    for (let x = 98; x <= 178; x += 16) {
      out += `<path d='M${x} 110 L${x + 8} 84 L${x + 16} 110 Z' fill='${dark}'/>`;
    }
    return out;
  }

  function buildSaddle(saddle) {
    if (saddle.id === 'none') return '';
    const trim = saddle.id === 'war'
      ? `<path d='M104 110 Q150 92 196 108' fill='none' stroke='#d4a017' stroke-width='3'/>`
      : '';
    return `<path d='M100 106 Q150 84 200 102 L194 118 Q150 104 106 118 Z' fill='${saddle.main}' stroke='${saddle.dark}' stroke-width='2'/>${trim}<path d='M150 112 L150 130' stroke='${saddle.dark}' stroke-width='4' stroke-linecap='round'/>`;
  }

  function buildAccessories(ids) {
    let out = '';
    if (ids.includes('collar')) {
      out += `<path d='M198 90 Q218 104 236 96' fill='none' stroke='#2b2b2b' stroke-width='7' stroke-linecap='round'/><circle cx='208' cy='98' r='2.5' fill='#f7d774'/><circle cx='222' cy='101' r='2.5' fill='#f7d774'/>`;
    }
    if (ids.includes('amulet')) {
      out += `<path d='M216 100 Q212 116 210 126' fill='none' stroke='#d4a017' stroke-width='2'/><circle cx='210' cy='134' r='7' fill='#7fd3f7' stroke='#2a6f8f' stroke-width='2'/>`;
    }
    if (ids.includes('helmet')) {
      out += `<path d='M206 66 Q210 34 234 32 Q258 34 260 58 Q236 44 206 70 Z' fill='#8a93a6' stroke='#3c4352' stroke-width='2' stroke-linejoin='round'/><path d='M232 34 L232 52' stroke='#d4a017' stroke-width='3' stroke-linecap='round'/>`;
    }
    if (ids.includes('crown')) {
      out += `<path d='M236 44 L236 30 L243 38 L249 26 L255 38 L262 30 L262 44 Z' fill='#f7d774' stroke='#8a6410' stroke-width='2' stroke-linejoin='round'/>`;
    }
    return out;
  }

  function renderSvg() {
    els.svg.innerHTML = buildSvg();
    const c = COLORS.find(x => x.id === state.color) || COLORS[0];
    const sad = SADDLES.find(x => x.id === state.saddle);
    const acc = ACCESSORIES.filter(a => state.accessories.includes(a.id)).map(a => a.label.toLowerCase());
    const parts = [`${c.label} дракон, чешуя «${SCALES.find(s => s.id === state.scale).label.toLowerCase()}», крылья «${WINGS.find(w => w.id === state.wing).label.toLowerCase()}»`];
    if (sad && sad.id !== 'none') parts.push(`седло «${sad.label.toLowerCase()}»`);
    if (acc.length) parts.push(acc.join(', '));
    els.caption.textContent = parts.join(', ') + '.';
  }

  function buildOptionGroup(title, name, items, type, selected) {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend');
    lg.textContent = title;
    const wrap = document.createElement('div');
    wrap.className = 'options';
    items.forEach(item => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.value = item.id;
      input.dataset.group = name;
      input.checked = type === 'checkbox' ? selected.includes(item.id) : selected === item.id;
      label.append(input, item.label);
      wrap.append(label);
    });
    fs.append(lg, wrap);
    return fs;
  }

  function renderCustoms() {
    els.customs.replaceChildren(
      buildOptionGroup('Цвет', 'color', COLORS, 'radio', state.color),
      buildOptionGroup('Чешуя', 'scale', SCALES, 'radio', state.scale),
      buildOptionGroup('Крылья', 'wing', WINGS, 'radio', state.wing),
      buildOptionGroup('Седло', 'saddle', SADDLES, 'radio', state.saddle),
      buildOptionGroup('Аксессуары', 'accessories', ACCESSORIES, 'checkbox', state.accessories)
    );
  }

  function renderBars() {
    const stats = [['Сытость', state.hunger], ['Силы', state.energy]];
    els.bars.replaceChildren(...stats.map(([label, value]) => {
      const row = document.createElement('div');
      const head = document.createElement('div');
      head.className = 'bar-head';
      const name = document.createElement('span');
      name.textContent = label;
      const num = document.createElement('span');
      num.textContent = Math.round(value);
      head.append(name, num);
      const track = document.createElement('div');
      track.className = 'track';
      track.setAttribute('role', 'progressbar');
      track.setAttribute('aria-label', label);
      track.setAttribute('aria-valuemin', '0');
      track.setAttribute('aria-valuemax', '100');
      track.setAttribute('aria-valuenow', String(Math.round(value)));
      const fill = document.createElement('i');
      fill.style.width = `${value}%`;
      track.append(fill);
      row.append(head, track);
      return row;
    }));
    const parts = Object.entries(LOOT).map(([k, v]) => `${v.group}: ${state.inv[k]}`);
    parts.push(`рекорд высоты: ${state.best} блоков`);
    els.inv.textContent = parts.join(' · ');
  }

  function renderLog() {
    els.log.replaceChildren(...state.log.map(entry => {
      const li = document.createElement('li');
      const time = document.createElement('time');
      time.dateTime = new Date(entry.t).toISOString();
      time.textContent = new Date(entry.t).toLocaleString('ru-RU');
      const text = document.createElement('span');
      text.textContent = entry.text;
      li.append(time, text);
      return li;
    }));
    els.empty.hidden = state.log.length > 0;
  }

  function renderAll() {
    renderSvg();
    renderBars();
    renderLog();
  }

  function commit(mutate) {
    applyDecay();
    mutate();
    state.hunger = clamp(state.hunger);
    state.energy = clamp(state.energy);
    save();
    renderAll();
    if (saveError) {
      els.msg.className = 'msg error';
      els.msg.textContent = 'Браузер не даёт сохранить состояние. Изменения действуют только до перезагрузки.';
    }
  }

  const ACTS = {
    hunt() {
      const biome = biomeLabel(els.biome.value);
      const roll = Math.random();
      const loot = roll < 0.45 ? 'meat' : roll < 0.75 ? 'nugget' : 'ore';
      state.inv[loot] += 1;
      state.energy -= 15;
      state.hunger -= 10;
      return `Охота в биоме «${biome}»: добыча — ${LOOT[loot].label}.`;
    },
    fly() {
      const biome = biomeLabel(els.biome.value);
      const height = 10 + Math.floor(Math.random() * 110);
      state.energy -= 20;
      state.hunger -= 5;
      const record = height > state.best;
      if (record) state.best = height;
      return `Полёт над «${biome}» на ${height} блоков${record ? ', новый рекорд высоты' : ''}.`;
    },
    eat() {
      if (state.inv.meat < 1) return null;
      state.inv.meat -= 1;
      state.hunger += 35;
      return 'Дракон съел кусок жареной баранины.';
    },
    rest() {
      state.energy += 40;
      state.hunger -= 5;
      return 'Дракон отдыхает в логове.';
    }
  };

  function setMessage(text, isError) {
    els.msg.className = isError ? 'msg error' : 'msg';
    els.msg.textContent = text;
  }

  BIOMES.forEach(b => els.biome.append(new Option(b.label, b.id)));

  els.customs.addEventListener('change', event => {
    const input = event.target;
    if (!input.dataset.group) return;
    commit(() => {
      if (input.dataset.group === 'accessories') {
        state.accessories = [...els.customs.querySelectorAll('input[data-group="accessories"]:checked')].map(i => i.value);
      } else {
        state[input.dataset.group] = input.value;
      }
      addLog(`Облик: ${input.closest('fieldset').querySelector('legend').textContent.toLowerCase()} — ${input.parentElement.textContent.trim()}.`);
    });
    save();
    renderLog();
  });

  document.querySelector('.actions').addEventListener('click', event => {
    const button = event.target.closest('button[data-act]');
    if (!button) return;
    const act = button.dataset.act;
    let text = null;
    commit(() => {
      text = ACTS[act]();
      if (text) addLog(text);
    });
    if (text === null) {
      setMessage('Мяса нет. Сначала поохоться.', true);
    } else {
      setMessage(text, false);
    }
  });

  els.noteForm.addEventListener('submit', event => {
    event.preventDefault();
    const text = els.noteText.value.trim();
    if (!text) return;
    commit(() => addLog(`Заметка: ${text}`));
    els.noteText.value = '';
  });

  els.clearLog.addEventListener('click', () => {
    if (!confirm('Очистить журнал логова?')) return;
    state.log = [];
    save();
    renderLog();
  });

  applyDecay();
  save();
  renderAll();
  setInterval(() => {
    applyDecay();
    save();
    renderBars();
  }, 30000);
})();
</script>
</body>
</html>
